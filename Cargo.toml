[package]
name = "semmap"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "mapgen"
path = "src/main.rs"

[lib]
name = "semmap"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ignore = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tree-sitter = "0.22"
tree-sitter-rust = "0.21"
tree-sitter-python = "0.21"
tree-sitter-go = "0.21"
tree-sitter-typescript = "0.21"

[dev-dependencies]
tempfile = "3"
